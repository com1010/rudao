name: IndexNow - notify search engines on push

# What this does
# -------------
# On every push to main that changes a page or the sitemap, this workflow
# tells Bing / Yandex / Naver / Seznam that RuDao changed, so they re-crawl
# within hours instead of weeks.
#
# Google does not participate in IndexNow. Google discovery relies on the
# sitemap plus Cloudflare Crawler Hints (a dashboard toggle, not this file).
#
# Why a custom User-Agent is set below: Cloudflare in front of rudao.us
# returns 403 to the default "Python-urllib/x.y" agent, so the ownership
# check would fail forever without it.
#
# The key is public by design: IndexNow verifies ownership by fetching
# https://rudao.us/<key>.txt and comparing it with the key in the request.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify key file, then submit sitemap URLs
        env:
          INDEXNOW_KEY: 10d80a769f3a77b4ebe184048bbdc70a
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request, urllib.error

          KEY = os.environ["INDEXNOW_KEY"]
          HOST = "rudao.us"
          KEY_URL = f"https://{HOST}/{KEY}.txt"
          UA = "RuDao-IndexNow/1.0 (+https://rudao.us)"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, r.read().decode("utf-8", "ignore")

          # Cloudflare Pages needs a moment to publish the new build.
          live = False
          for attempt in range(1, 7):
              try:
                  status, served = get(KEY_URL)
                  if status == 200 and served.strip() == KEY:
                      print(f"key file verified (attempt {attempt})", flush=True)
                      live = True
                      break
                  print(f"attempt {attempt}: status {status}, body {served[:40]!r}", flush=True)
              except Exception as exc:
                  print(f"attempt {attempt}: {exc}", flush=True)
              time.sleep(8)
          if not live:
              sys.exit(f"key file not reachable at {KEY_URL}; aborting")

          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = [u.strip() for u in re.findall(r"<loc>\s*(.*?)\s*</loc>", xml)]
          urls = [
              u for u in urls
              if u.startswith(f"https://{HOST}")
              and not re.search(r"\.(jpg|jpeg|png|webp|svg|gif)$", u, re.I)
          ]
          if not urls:
              sys.exit("no page URLs found in sitemap.xml")

          print(f"submitting {len(urls)} URL(s):", flush=True)
          for u in urls:
              print("  -", u, flush=True)

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": KEY_URL,
              "urlList": urls,
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": UA},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow accepted: HTTP {r.status} {r.reason}", flush=True)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "ignore")[:500]
              print(f"IndexNow error: HTTP {exc.code} {exc.reason} - {detail}", flush=True)
              sys.exit(1)
          PY

      - name: Summary
        run: |
          {
            echo "### IndexNow submitted"
            echo ""
            echo "Host: https://rudao.us - Bing / Yandex / Naver / Seznam will re-crawl shortly."
            echo "Google is not part of IndexNow; it follows the sitemap."
          } >> "$GITHUB_STEP_SUMMARY"
