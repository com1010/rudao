    /* Standalone chat page: the widget panel fills the page centre.

    .chat-intro {
        max-width: 780px; width: 100%; margin: 0 auto; padding: 14px 18px 0;

    /* The widget mounts .rp-root (fixed) on body; anchor it below the

    body.chatpage .rp-root {
        position: fixed; left: 0; right: 0; top: 158px; bottom: 0;

    body.chatpage .rp-root .rp-panel {
        position: relative; right: auto; bottom: auto;
        width: min(780px, 100%); max-height: none; height: 100%;

    /* Closing makes no sense on a page that IS the chat. */
    body.chatpage .rp-close { display: none; }
